name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "package.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Synchronize Version Badges with package.json
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = pkg.version;
            let html = fs.readFileSync("website/index.html", "utf8");
            html = html.replace(/<span class="brand-tag">v[0-9.]+<\/span>/g, `<span class="brand-tag">v${version}</span>`);
            html = html.replace(/Version <strong>v[0-9.]+<\/strong> Live/g, `Version <strong>v${version}</strong> Live`);
            html = html.replace(/ArmoryVault-Setup-[0-9.]+\.exe/g, `ArmoryVault-Setup-${version}.exe`);
            html = html.replace(/ArmoryVault-[0-9.]+\.AppImage/g, `ArmoryVault-${version}.AppImage`);
            fs.writeFileSync("website/index.html", html);
            console.log(`✓ Synchronized website/index.html with package.json (v${version})`);
          '

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
