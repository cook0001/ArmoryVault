name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v2.8.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v2.8.0)

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Step 1: Create a single Draft release first to avoid matrix race conditions (422 already_exists)
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Ensure Draft Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Preparing official release for tag: $TAG_NAME"

          # Delete any partial/stale release for this tag if it exists without assets
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, converting to draft or reusing."
          else
            gh release create "$TAG_NAME" \
              --draft \
              --title "ArmoryVault $TAG_NAME" \
              --generate-notes || true
          fi

  # Step 2: Build on all OS platforms and upload assets directly to the existing draft
  build-matrix:
    name: Build (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build & Package Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: node scripts/build-ci.js

  # Step 3: Publish the release and verify all OS assets exist
  verify-and-publish:
    name: Verify Assets & Publish Release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Verify Multi-Platform Assets and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.tag_name || github.ref_name }}"
          echo "Verifying published assets for $TAG_NAME..."

          # Publish release (remove draft status)
          gh release edit "$TAG_NAME" --draft=false --prerelease=false || true

          # Fetch asset list
          ASSETS=$(gh release view "$TAG_NAME" --json assets -q '.assets[].name')
          echo "============================================"
          echo "Uploaded Release Assets:"
          echo "$ASSETS"
          echo "============================================"

          HAS_MAC=$(echo "$ASSETS" | grep -iE '\.dmg$' || true)
          HAS_WIN=$(echo "$ASSETS" | grep -iE '\.exe$' || true)
          HAS_LINUX=$(echo "$ASSETS" | grep -iE '\.AppImage$' || true)

          ERRORS=0
          if [ -z "$HAS_MAC" ]; then
            echo "⚠️ WARNING: macOS installer (.dmg) missing from release assets!"
            ERRORS=$((ERRORS+1))
          else
            echo "✅ macOS installer (.dmg) verified."
          fi

          if [ -z "$HAS_WIN" ]; then
            echo "⚠️ WARNING: Windows installer (.exe) missing from release assets!"
            ERRORS=$((ERRORS+1))
          else
            echo "✅ Windows installer (.exe) verified."
          fi

          if [ -z "$HAS_LINUX" ]; then
            echo "⚠️ WARNING: Linux package (.AppImage) missing from release assets!"
            ERRORS=$((ERRORS+1))
          else
            echo "✅ Linux package (.AppImage) verified."
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "❌ Release asset verification failed with $ERRORS missing platform builds."
            exit 1
          fi

          echo "🎉 All multi-platform installers verified and release published successfully!"

      - name: Prune Superseded Releases (Retain 3 Most Recent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Running automated release retention pruning (Policy: 3 Latest Releases)..."
          node scripts/prune-releases.js || echo "⚠️ Non-fatal pruning notice: continuing."
